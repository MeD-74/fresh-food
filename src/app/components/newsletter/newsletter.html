<div class="container mx-auto px-4 my-10">
  <div class="newsletter-box rounded-md flex flex-col md:flex-row items-center justify-between relative overflow-hidden">
    <img src="/assets/images/1.jpg" alt="Join our newsletter" class="newsletter-bg" />

    <div class="newsletter-content z-10 w-full md:w-1/2">
      <h2 class="text-white text-2xl md:text-3xl font-bold mb-2">Join Our Newsletter And Get...</h2>
      <p class="text-white/75 mb-7 text-sm md:text-base">$20 discount for your first order</p>

      <div class="flex items-center bg-white rounded-sm p-1 max-w-md">
        <span class="pl-3 pr-2 text-fresh-green">

            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"

          class="bg-[#ff4f4f] hover:bg-red-600 text-white font-bold py-2 px-5 rounded-sm transition duration-300 flex items-center gap-2 text-sm"

          Subscribe
