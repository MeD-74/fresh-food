<div class="contact-wrapper">
  <section class="breadcrumb-section">
    <div class="container breadcrumb-inner">
      <h2>Contact Us</h2>
      <nav>
        <a href="#">Home</a>
        <span class="separator">></span>
        <span class="current">Contact Us</span>
      </nav>
    </div>
  </section>

  <section class="contact-main-section">
    <div class="container">
      <div class="contact-grid">
        <div class="contact-info-side">
          <div class="illustration-container">
            <img src="assets\images\contact-us.png" alt="Contact Illustration" />
          </div>

          <h3 class="section-title">Get In Touch</h3>

          <div class="info-cards-grid">
            <div class="info-card">
              <div class="icon-box">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
                  ></path>
                </svg>
              </div>
              <div class="card-details">
                <h4>Phone</h4>
                <p>(+1) 618 190 496</p>
              </div>
            </div>

            <div class="info-card">
              <div class="icon-box">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                  ></path>
                  <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
              </div>
              <div class="card-details">
                <h4>Email</h4>
                <p>geweto9420@chokxus.com</p>
              </div>
            </div>

            <div class="info-card">
              <div class="icon-box">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                  <circle cx="12" cy="10" r="3"></circle>
                </svg>
              </div>
              <div class="card-details">
                <h4>London Office</h4>
                <p>Cruce Casa de Postas 29</p>
              </div>
            </div>

            <div class="info-card">
              <div class="icon-box">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
                  <line x1="4" y1="22" x2="4" y2="15"></line>
                </svg>
              </div>
              <div class="card-details">
                <h4>Bournemouth Office</h4>
                <p>Visitación de la Encina 22</p>
              </div>
            </div>
          </div>
        </div>

        <div class="contact-form-side">
          <div class="form-container">
            <form (submit)="$event.preventDefault()">
              <div class="form-row">
                <div class="input-group">
                  <label>First Name</label>
                  <div class="input-with-icon">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                      <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <input type="text" placeholder="Enter First Name" />
                  </div>
                </div>
                <div class="input-group">
                  <label>Last Name</label>
                  <div class="input-with-icon">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                      <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <input type="text" placeholder="Enter Last Name" />
                  </div>
                </div>
              </div>

              <div class="form-row">
                <div class="input-group">
                  <label>Email Address</label>
                  <div class="input-with-icon">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path
                        d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                      ></path>
                      <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                    <input type="email" placeholder="Enter Email Address" />
                  </div>
                </div>
                <div class="input-group">
                  <label>Phone Number</label>
                  <div class="input-with-icon">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                      <line x1="12" y1="18" x2="12.01" y2="18"></line>
                    </svg>
                    <input type="tel" placeholder="Enter Your Phone Number" />
                  </div>
                </div>
              </div>

              <div class="input-group full-width">
                <label>Message</label>
                <div class="input-with-icon align-top">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                  </svg>
                  <textarea rows="5" placeholder="Enter Your Message"></textarea>
                </div>
              </div>

              <div class="submit-action">
                <button type="submit" class="btn-submit">Send Message</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="map-section">
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d115408.24588729574!2d55.204683057864386!3d25.07474423719001!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3e5f43496ad9c645%3A0xbde66e5084295162!2sDubai%20-%20United%20Arab%20Emirates!5e0!3m2!1sen!2seg!4v1700000000000!5m2!1sen!2seg"
      width="100%"
      height="450"
      style="border: 0"
      allowfullscreen=""
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
    >
    </iframe>
  </section>
</div>
